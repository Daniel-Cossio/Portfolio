<!doctype html>
<html lang="en" data-theme="dark" data-accent="monochrome">
  <head>
    <meta charset="utf-8" />
    <title>Daniel Cossio | Java Software Architect & Systems Engineer</title>
    <meta name="description" content="Portfolio of Daniel Felipe Cossio Marulanda - Systems Engineer and Java Software Architect specializing in Spring Boot, Hexagonal Architecture, Kubernetes, and Agentic Engineering." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dcss-theme') || localStorage.getItem('theme');
          var nextTheme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', nextTheme);
          document.documentElement.setAttribute('data-accent', 'monochrome');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
