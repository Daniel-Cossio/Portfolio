<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Daniel Cossio | Java Software Architect & Systems Engineer</title>
    <meta name="description" content="Portfolio of Daniel Felipe Cossio Marulanda - Systems Engineer and Java Software Architect specializing in Spring Boot, Hexagonal Architecture, Kubernetes, and Agentic Engineering." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <app-root></app-root>
  </body>
</html>
